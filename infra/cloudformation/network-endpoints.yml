AWSTemplateFormatVersion: "2010-09-09"
Description: Solo Vault VPC endpoints for private Lambda/ECS access to AWS APIs

# Why this exists:
#   The Lambda functions live in private subnets with no NAT gateway. Without
#   an outbound path they can't reach AWS service APIs over the internet.
#   Interface endpoints put a private ENI inside our VPC that resolves to the
#   AWS service over the AWS backbone — no public traffic, no NAT cost.
#
# Endpoints are deployed in both private subnets because Vault CRUD, fn-store,
# and ECS embed tasks run without NAT. S3 is a gateway endpoint on the private
# route table; AWS API endpoints use interface endpoints with private DNS.

Parameters:
  ProjectPrefix:
    Type: String
    AllowedPattern: "^[a-z0-9-]+$"
  EnvironmentName:
    Type: String
    AllowedPattern: "^[a-z0-9-]+$"

Resources:
  # Endpoint ENIs need their own SG. Allow inbound 443 from the Lambda SG so
  # the SDK calls succeed; nothing else needs in.
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "VPC interface endpoint access (${EnvironmentName})"
      VpcId:
        Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-vpc-id"
      SecurityGroupIngress:
        - SourceSecurityGroupId:
            Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-lambda-sg-id"
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          Description: HTTPS from Lambda SG to AWS service endpoints
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: "-1"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-${EnvironmentName}-vpce-sg"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectPrefix

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcId:
        Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-vpc-id"
      SubnetIds:
        - Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-private-subnet-a-id"
        - Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-private-subnet-b-id"
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      # Required so the standard SDK URL (secretsmanager.us-east-1.amazonaws.com)
      # resolves to the endpoint ENI instead of the public IP. Without this,
      # callers would need to pass an --endpoint-url override.
      PrivateDnsEnabled: true

  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcId:
        Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-vpc-id"
      SubnetIds:
        - Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-private-subnet-a-id"
        - Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-private-subnet-b-id"
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      PrivateDnsEnabled: true

  StepFunctionsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.states"
      VpcId:
        Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-vpc-id"
      SubnetIds:
        - Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-private-subnet-a-id"
        - Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-private-subnet-b-id"
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      PrivateDnsEnabled: true

  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
      VpcId:
        Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-vpc-id"
      SubnetIds:
        - Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-private-subnet-a-id"
        - Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-private-subnet-b-id"
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      PrivateDnsEnabled: true

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
      VpcId:
        Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-vpc-id"
      SubnetIds:
        - Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-private-subnet-a-id"
        - Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-private-subnet-b-id"
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      PrivateDnsEnabled: true

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcId:
        Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-vpc-id"
      RouteTableIds:
        - Fn::ImportValue: !Sub "${ProjectPrefix}-${EnvironmentName}-private-route-table-id"

Outputs:
  EndpointSecurityGroupId:
    Value: !Ref EndpointSecurityGroup
    Export:
      Name: !Sub "${ProjectPrefix}-${EnvironmentName}-vpce-sg-id"
  SecretsManagerEndpointId:
    Value: !Ref SecretsManagerEndpoint
  CloudWatchLogsEndpointId:
    Value: !Ref CloudWatchLogsEndpoint
  StepFunctionsEndpointId:
    Value: !Ref StepFunctionsEndpoint
  EcrApiEndpointId:
    Value: !Ref EcrApiEndpoint
  EcrDkrEndpointId:
    Value: !Ref EcrDkrEndpoint
  S3GatewayEndpointId:
    Value: !Ref S3GatewayEndpoint
