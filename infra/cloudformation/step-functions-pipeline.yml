AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Solo Vault — Step Functions state machine for the indexing pipeline.
  Orchestrates: validate -> download+parse -> chunk -> enqueue warm embed worker.

Parameters:
  ProjectPrefix:
    Type: String
    Default: solo-vault
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  FnValidateArn:
    Type: String
    Description: ARN of the validate Lambda function
  FnDownloadParseArn:
    Type: String
    Description: ARN of the download+parse Lambda function
  FnChunkArn:
    Type: String
    Description: ARN of the chunk Lambda function
  FnStoreArn:
    Type: String
    Description: ARN of the store Lambda function
  EmbedQueueArn:
    Type: String
    Description: ARN of the warm embed SQS queue
  EmbedQueueUrl:
    Type: String
    Description: URL of the warm embed SQS queue
  EcsClusterArn:
    Type: String
    Description: Legacy parameter retained for deploy compatibility
  EmbedTaskDefArn:
    Type: String
    Description: Legacy parameter retained for deploy compatibility
  PrivateSubnetA:
    Type: String
    Description: First private subnet ID for ECS tasks
  PrivateSubnetB:
    Type: String
    Description: Second private subnet ID for ECS tasks
  LambdaSecurityGroup:
    Type: String
    Description: Security group ID for Lambda/ECS

Resources:
  # -----------------------------------------------------------------------
  # IAM role for Step Functions
  # -----------------------------------------------------------------------
  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectPrefix}-sfn-pipeline-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambdas
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Ref FnValidateArn
                  - !Ref FnDownloadParseArn
                  - !Ref FnChunkArn
                  - !Ref FnStoreArn
        - PolicyName: EnqueueEmbedJobs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !Ref EmbedQueueArn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'

  # -----------------------------------------------------------------------
  # State machine
  # -----------------------------------------------------------------------
  IndexPipeline:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ProjectPrefix}-index-pipeline-${Environment}'
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Solo Vault Indexing Pipeline",
          "StartAt": "Validate",
          "States": {
            "Validate": {
              "Type": "Task",
              "Resource": "${FnValidateArn}",
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "MaxAttempts": 2, "IntervalSeconds": 2, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "MarkFailed"}],
              "Next": "DownloadParse"
            },
            "DownloadParse": {
              "Type": "Task",
              "Resource": "${FnDownloadParseArn}",
              "TimeoutSeconds": 900,
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "MaxAttempts": 2, "IntervalSeconds": 3, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "CheckAlreadyIndexed"}],
              "Next": "Chunk"
            },
            "CheckAlreadyIndexed": {
              "Type": "Choice",
              "Choices": [{"Variable": "$.error.Cause", "StringMatches": "*ALREADY_INDEXED*", "Next": "CloneFromSource"}],
              "Default": "MarkFailed"
            },
            "Chunk": {
              "Type": "Task",
              "Resource": "${FnChunkArn}",
              "TimeoutSeconds": 120,
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "MaxAttempts": 2, "IntervalSeconds": 2, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "MarkFailed"}],
              "Next": "Embed"
            },
            "Embed": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sqs:sendMessage",
              "Parameters": {
                "QueueUrl": "${EmbedQueueUrl}",
                "MessageBody.$": "States.JsonToString($)"
              },
              "ResultPath": "$.embedQueueResult",
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "MaxAttempts": 3, "IntervalSeconds": 2, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "MarkFailed"}],
              "End": true
            },
            "CloneFromSource": {
              "Type": "Task",
              "Resource": "${FnStoreArn}",
              "Parameters": {"action": "clone", "entry_id.$": "$.entry_id", "user_id.$": "$.user_id", "file_hash.$": "$.file_hash"},
              "End": true
            },
            "MarkFailed": {
              "Type": "Task",
              "Resource": "${FnStoreArn}",
              "Parameters": {"action": "mark_failed", "entry_id.$": "$.entry_id", "user_id.$": "$.user_id", "error.$": "$.error"},
              "End": true
            }
          }
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectPrefix
        - Key: Environment
          Value: !Ref Environment

Outputs:
  StateMachineArn:
    Description: ARN of the indexing pipeline state machine
    Value: !Ref IndexPipeline
    Export:
      Name: !Sub '${ProjectPrefix}-sfn-pipeline-arn-${Environment}'
