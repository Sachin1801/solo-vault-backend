AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Solo Vault — Pipeline Lambda functions + IAM roles + ECS task definition.
  Deploys: fn-validate, fn-download-parse, fn-chunk, fn-store, sqs-starter.

Parameters:
  ProjectPrefix:
    Type: String
    Default: solo-vault
  Environment:
    Type: String
    Default: dev
  VpcId:
    Type: String
    Description: VPC ID from shared-network stack
  PrivateSubnetA:
    Type: String
    Description: Private subnet A ID
  PrivateSubnetB:
    Type: String
    Description: Private subnet B ID
  LambdaSecurityGroup:
    Type: String
    Description: Lambda security group ID
  IndexQueueArn:
    Type: String
    Description: SQS index queue ARN
  IndexQueueUrl:
    Type: String
    Description: SQS index queue URL
  EmbedQueueArn:
    Type: String
    Description: SQS queue ARN for warm embed jobs
  EmbedQueueUrl:
    Type: String
    Description: SQS queue URL for warm embed jobs
  EmbedQueueName:
    Type: String
    Description: SQS queue name for warm embed jobs
  StateMachineArn:
    Type: String
    Description: Step Functions state machine ARN
  DbSecretArn:
    Type: String
    Description: Secrets Manager ARN for DB credentials
    Default: ''
  S3BucketName:
    Type: String
    Default: solo-vault-vault-dev
  DownloadParseImageUri:
    Type: String
    Description: Existing ECR image URI for fn-download-parse, including tag
  EmbedImageUri:
    Type: String
    Description: Existing ECR image URI for the embed ECS task, including tag
  EmbedDesiredCount:
    Type: Number
    Default: 1
    Description: Minimum warm embed workers to keep running
  EmbedMaxCapacity:
    Type: Number
    Default: 2
    Description: Maximum warm embed workers for queue-depth autoscaling

Resources:
  # =====================================================================
  # IAM Role — shared by all pipeline Lambdas
  # =====================================================================
  PipelineLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectPrefix}-pipeline-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${S3BucketName}'
                  - !Sub 'arn:aws:s3:::${S3BucketName}/*'
        - PolicyName: KmsForVaultFiles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  Fn::ImportValue: !Sub '${ProjectPrefix}-${Environment}-s3-cmk-arn'
        - PolicyName: KmsForDbSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource:
                  Fn::ImportValue: !Sub '${ProjectPrefix}-${Environment}-rds-cmk-arn'
        - PolicyName: SQSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !Ref IndexQueueArn
        - PolicyName: StepFunctionsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !Ref StateMachineArn
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: '*'

  # =====================================================================
  # IAM Role — ECS task execution role
  # =====================================================================
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectPrefix}-ecs-exec-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # =====================================================================
  # IAM Role — ECS task role (what the container can do)
  # =====================================================================
  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectPrefix}-ecs-task-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub 'arn:aws:s3:::${S3BucketName}/*'
        - PolicyName: EmbedQueueAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !Ref EmbedQueueArn
        - PolicyName: StoreLambdaInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt FnStore.Arn
        - PolicyName: KmsForVaultFiles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  Fn::ImportValue: !Sub '${ProjectPrefix}-${Environment}-s3-cmk-arn'
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  # =====================================================================
  # Lambda: SQS Starter (reads SQS, starts Step Functions execution)
  # =====================================================================
  SqsStarterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectPrefix}-sqs-starter-${Environment}'
      Runtime: python3.12
      Handler: index.handler
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt PipelineLambdaRole.Arn
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref StateMachineArn
      Code:
        ZipFile: |
          import json
          import os
          import boto3

          sfn = boto3.client("stepfunctions")
          SFN_ARN = os.environ["STATE_MACHINE_ARN"]

          def handler(event, context):
              for record in event.get("Records", []):
                  body = json.loads(record["body"])
                  # S3 event notification wraps in Records
                  for s3_record in body.get("Records", [body]):
                      s3_info = s3_record.get("s3", {})
                      bucket = s3_info.get("bucket", {}).get("name", "")
                      key = s3_info.get("object", {}).get("key", "")
                      size = s3_info.get("object", {}).get("size", 0)
                      if not bucket or not key:
                          continue
                      parts = key.split("/")
                      if len(parts) >= 6 and parts[0] == "users" and parts[2] == "entries" and parts[4] == "objects":
                          user_id = parts[1]
                          entry_id = parts[3]
                      else:
                          user_id = "unknown"
                          entry_id = key.replace("/", "-")
                      sfn_input = {
                          "entry_id": entry_id,
                          "user_id": user_id,
                          "s3_key": key,
                          "bucket": bucket,
                          "file_name": key.split("/")[-1],
                          "mime": "application/octet-stream",
                          "kind": "unsorted",
                          "subkind": "",
                          "size_bytes": size,
                          "title": key.split("/")[-1],
                          "classifier_confidence": 0.5,
                      }
                      sfn.start_execution(
                          stateMachineArn=SFN_ARN,
                          name=entry_id[:80],
                          input=json.dumps(sfn_input),
                      )
              return {"statusCode": 200}
      Tags:
        - Key: Project
          Value: !Ref ProjectPrefix

  SqsStarterEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !Ref IndexQueueArn
      FunctionName: !Ref SqsStarterFunction
      BatchSize: 10
      Enabled: true

  # =====================================================================
  # Lambda: fn-validate
  # =====================================================================
  FnValidate:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectPrefix}-fn-validate-${Environment}'
      Runtime: python3.12
      Handler: handler.handler
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt PipelineLambdaRole.Arn
      Environment:
        Variables:
          S3_REGION: us-east-1
          S3_BUCKET: !Ref S3BucketName
      Code:
        # Placeholder — replaced by actual zip upload via deploy script
        ZipFile: |
          def handler(event, context):
              raise NotImplementedError("Deploy actual handler.py via update-code")
      Tags:
        - Key: Project
          Value: !Ref ProjectPrefix

  # =====================================================================
  # Lambda: fn-chunk
  # =====================================================================
  FnChunk:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectPrefix}-fn-chunk-${Environment}'
      Runtime: python3.12
      Handler: handler.handler
      MemorySize: 512
      Timeout: 120
      Role: !GetAtt PipelineLambdaRole.Arn
      Environment:
        Variables:
          S3_REGION: us-east-1
          S3_BUCKET: !Ref S3BucketName
      Code:
        ZipFile: |
          def handler(event, context):
              raise NotImplementedError("Deploy actual handler.py via update-code")
      Tags:
        - Key: Project
          Value: !Ref ProjectPrefix

  # =====================================================================
  # Lambda: fn-download-parse (container image — created empty, updated later)
  # =====================================================================
  FnDownloadParse:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectPrefix}-fn-download-parse-${Environment}'
      PackageType: Image
      Architectures:
        - x86_64
      MemorySize: 2048
      Timeout: 900
      Role: !GetAtt PipelineLambdaRole.Arn
      Environment:
        Variables:
          S3_REGION: us-east-1
          S3_BUCKET: !Ref S3BucketName
          # Compatibility for older fn-download-parse images that import
          # app.config at parser load time. Newer images parse standalone.
          db_host: unused
          db_user: unused
          db_password: unused
          s3_access_key: unused
          s3_secret_key: unused
          PARSER_PREFER_DOCLING: 'false'
      Code:
        ImageUri: !Ref DownloadParseImageUri
      Tags:
        - Key: Project
          Value: !Ref ProjectPrefix

  # =====================================================================
  # Lambda: fn-store (needs VPC for RDS access)
  # =====================================================================
  FnStore:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectPrefix}-fn-store-${Environment}'
      Runtime: python3.12
      Handler: handler.handler
      MemorySize: 512
      Timeout: 120
      Role: !GetAtt PipelineLambdaRole.Arn
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Environment:
        Variables:
          S3_REGION: us-east-1
          S3_BUCKET: !Ref S3BucketName
          DB_SECRET_ARN: !Ref DbSecretArn
          CHUNKER_VERSION: '1'
          EMBEDDING_MODEL: BAAI/bge-m3
      Code:
        ZipFile: |
          def handler(event, context):
              raise NotImplementedError("Deploy actual handler.py via update-code")
      Tags:
        - Key: Project
          Value: !Ref ProjectPrefix

  # =====================================================================
  # Lambda: fn-query-embed (synchronous BGE-M3 query embedding)
  # =====================================================================
  FnQueryEmbed:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectPrefix}-fn-query-embed-${Environment}'
      PackageType: Image
      Architectures:
        - x86_64
      MemorySize: 8192
      Timeout: 60
      Role: !GetAtt PipelineLambdaRole.Arn
      Environment:
        Variables:
          S3_REGION: us-east-1
          EMBEDDING_MODEL: BAAI/bge-m3
          EMBEDDING_DIM: '384'
          PYTHONUNBUFFERED: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
      Code:
        ImageUri: !Ref EmbedImageUri
      ImageConfig:
        EntryPoint:
          - python
          - -m
          - awslambdaric
        Command:
          - entrypoint.handler
      Tags:
        - Key: Project
          Value: !Ref ProjectPrefix

  # =====================================================================
  # ECS Cluster + Task Definition for fn-embed
  # =====================================================================
  EmbedCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectPrefix}-embed-cluster-${Environment}'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectPrefix

  EmbedLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectPrefix}-fn-embed-${Environment}'
      RetentionInDays: 14

  EmbedTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectPrefix}-fn-embed-${Environment}'
      Cpu: '2048'
      Memory: '8192'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: embed
          Image: !Ref EmbedImageUri
          Essential: true
          Environment:
            - Name: S3_REGION
              Value: us-east-1
            - Name: S3_BUCKET
              Value: !Ref S3BucketName
            - Name: EMBED_QUEUE_URL
              Value: !Ref EmbedQueueUrl
            - Name: STORE_FUNCTION_NAME
              Value: !Ref FnStore
            - Name: EMBEDDING_MODEL
              Value: BAAI/bge-m3
            - Name: EMBEDDING_DIM
              Value: '384'
            - Name: EMBED_JOB_VISIBILITY_TIMEOUT
              Value: '1800'
            - Name: EMBED_JOB_MAX_ATTEMPTS
              Value: '3'
            - Name: PYTHONUNBUFFERED
              Value: '1'
            - Name: HF_HUB_OFFLINE
              Value: '1'
            - Name: TRANSFORMERS_OFFLINE
              Value: '1'
            - Name: HF_HUB_DISABLE_TELEMETRY
              Value: '1'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EmbedLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: embed
      Tags:
        - Key: Project
          Value: !Ref ProjectPrefix

  EmbedService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${ProjectPrefix}-embed-worker-${Environment}'
      Cluster: !Ref EmbedCluster
      LaunchType: FARGATE
      DesiredCount: !Ref EmbedDesiredCount
      TaskDefinition: !Ref EmbedTaskDefinition
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
          SecurityGroups:
            - !Ref LambdaSecurityGroup
          AssignPublicIp: DISABLED
      Tags:
        - Key: Project
          Value: !Ref ProjectPrefix
        - Key: Environment
          Value: !Ref Environment

  EmbedWorkerScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: EmbedService
    Properties:
      MaxCapacity: !Ref EmbedMaxCapacity
      MinCapacity: !Ref EmbedDesiredCount
      ResourceId: !Sub 'service/${ProjectPrefix}-embed-cluster-${Environment}/${ProjectPrefix}-embed-worker-${Environment}'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  EmbedWorkerScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${ProjectPrefix}-embed-worker-queue-depth-${Environment}'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref EmbedWorkerScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 1.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
        CustomizedMetricSpecification:
          Namespace: AWS/SQS
          MetricName: ApproximateNumberOfMessagesVisible
          Dimensions:
            - Name: QueueName
              Value: !Ref EmbedQueueName
          Statistic: Average

Outputs:
  PipelineLambdaRoleArn:
    Value: !GetAtt PipelineLambdaRole.Arn
    Export:
      Name: !Sub '${ProjectPrefix}-pipeline-lambda-role-arn-${Environment}'
  FnValidateArn:
    Value: !GetAtt FnValidate.Arn
    Export:
      Name: !Sub '${ProjectPrefix}-fn-validate-arn-${Environment}'
  FnDownloadParseArn:
    Value: !GetAtt FnDownloadParse.Arn
    Export:
      Name: !Sub '${ProjectPrefix}-fn-download-parse-arn-${Environment}'
  FnChunkArn:
    Value: !GetAtt FnChunk.Arn
    Export:
      Name: !Sub '${ProjectPrefix}-fn-chunk-arn-${Environment}'
  FnStoreArn:
    Value: !GetAtt FnStore.Arn
    Export:
      Name: !Sub '${ProjectPrefix}-fn-store-arn-${Environment}'
  FnQueryEmbedArn:
    Value: !GetAtt FnQueryEmbed.Arn
    Export:
      Name: !Sub '${ProjectPrefix}-fn-query-embed-arn-${Environment}'
  FnQueryEmbedName:
    Value: !Ref FnQueryEmbed
    Export:
      Name: !Sub '${ProjectPrefix}-fn-query-embed-name-${Environment}'
  EcsClusterArn:
    Value: !GetAtt EmbedCluster.Arn
    Export:
      Name: !Sub '${ProjectPrefix}-embed-cluster-arn-${Environment}'
  EmbedTaskDefinitionArn:
    Value: !Ref EmbedTaskDefinition
    Export:
      Name: !Sub '${ProjectPrefix}-embed-taskdef-arn-${Environment}'
  EcrDownloadParseUri:
    Value: !Ref DownloadParseImageUri
  EcrEmbedUri:
    Value: !Ref EmbedImageUri
